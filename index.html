<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Giant BYoungPool Game</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6efe2;--grass:#8cc152;--deep:#2f5d3a;--ink:#33402f;--green:#7cb342;--green-d:#4f7f25}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#e6decd;font-family:'Jua','Hiragino Maru Gothic ProN','PingFang TC','PingFang SC','Noto Sans CJK',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
header{padding:10px 14px 8px;background:#fffaf0;border-bottom:2px solid #eadfca}
.top{display:flex;align-items:center;gap:6px}
.langs{display:flex;gap:3px;flex:none}
.langs button{font:inherit;font-size:12px;min-width:26px;border:none;border-radius:8px;padding:4px 6px;background:#eee6d6;color:#7a705e;cursor:pointer}
.langs button.on{background:var(--deep);color:#fff}
.steprow{display:flex;align-items:center;gap:6px;margin-top:8px}
.steprow .steps{flex:1;margin-top:0}
.steprow .pill{font-size:13px;padding:3px 9px;white-space:nowrap}
.logo{flex:1;font-size:17px;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{font-size:12px;color:#8a9a7e;margin-left:4px}
.pill{background:var(--deep);color:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
.steps{display:flex;gap:4px;margin-top:8px}
.steps div{flex:1;min-width:0;text-align:center;font-size:11px;padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:10px;background:#eee6d6;color:#9a917f;transition:.3s}
.steps div.on{background:var(--green);color:#fff;transform:scale(1.05)}
.steps div.done{background:#cfe3b5;color:var(--deep)}
.scene{flex:1;position:relative;overflow:hidden}
.controls{min-height:84px;padding:10px 12px 14px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;background:#fffaf0;border-top:2px solid #eadfca}
.btn{font-family:inherit;font-size:18px;border:none;border-radius:16px;padding:13px 18px;background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d);cursor:pointer;touch-action:none}
.btn:active,.btn.held{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.orange{background:#f39c32;box-shadow:0 5px 0 #b86c14}
.btn.orange:active,.btn.orange.held{box-shadow:0 1px 0 #b86c14}
.btn.blue{background:#4a9fd8;box-shadow:0 5px 0 #2a6e9e}
.btn.blue:active,.btn.blue.held{box-shadow:0 1px 0 #2a6e9e}
.btn.big{font-size:22px;padding:16px 26px}
.btn[disabled]{opacity:.45;pointer-events:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;padding:6px 4px;border-radius:16px;background:#fff;border:3px solid #eadfca;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #d9ccb3}
.tool svg{width:38px;height:38px}
.tool.sel{border-color:var(--green);background:#f1f8e6;transform:translateY(-3px)}
/* talk */
.talk{position:absolute;left:10px;right:10px;top:8px;display:flex;align-items:flex-start;gap:6px;pointer-events:none;z-index:30}
.tigerimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(47,93,58,.25)}
.hero{background:linear-gradient(#e4f0d4,#cfe3b5)}
.hero-img{position:absolute;left:0;right:0;top:0;bottom:40%;background:url(assets/tiger-hero.jpg) center 80%/cover}
.talk .tg{width:58px;flex:none;animation:bob 2s ease-in-out infinite}
.bubble{background:#fff;border-radius:16px;padding:9px 13px;font-size:15px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.08);position:relative;margin-top:6px}
.bubble:before{content:'';position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.goal{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;padding:6px 16px;font-size:17px;display:flex;align-items:center;gap:6px;z-index:20;white-space:nowrap}
.goal svg{width:26px;height:26px}
.float{position:absolute;font-size:20px;color:#fff;-webkit-text-stroke:1px var(--deep);pointer-events:none;animation:floatUp 1s forwards;z-index:40;font-weight:bold}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}
/* farm */
.farm-bg{background:radial-gradient(ellipse 130% 72% at 50% 64%,#a6d56f 0 57%,#7fb04a 57.5% 61%,transparent 61.5%),var(--cream)}
.gh{position:absolute;left:5%;right:5%;top:96px;bottom:56px;border:4px solid #fff;border-radius:18px;background:rgba(255,255,255,.28);box-shadow:0 8px 0 rgba(0,0,0,.06);padding:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;background-image:linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:33.3% 100%}
.plot{position:relative;border-radius:14px;background:linear-gradient(#94633b,#6e4527);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.1);cursor:pointer;overflow:visible}
.plot:active{transform:scale(.97)}
.plot .plant{position:absolute;left:0;right:0;bottom:16px;width:100%;height:78%;transition:transform .3s}
.plot .plant.giant{filter:drop-shadow(0 0 6px #ffe36b)}
.plot .bar{position:absolute;left:10%;right:10%;bottom:6px;height:7px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.plot .bar i{display:block;height:100%;background:#7ed957;transition:width .3s}
.plot .tag{position:absolute;top:4px;right:4px;font-size:11px;background:#fff;border-radius:8px;padding:2px 6px;color:var(--deep)}
.plot .tag.g{background:#ffd84d}
.drop{position:absolute;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#5fb6e8;animation:drop .6s ease-in forwards;pointer-events:none;z-index:25}
@keyframes drop{from{transform:translateY(-40px);opacity:0}30%{opacity:1}to{transform:translateY(20px);opacity:0}}
.spark{position:absolute;pointer-events:none;font-size:18px;animation:spark .9s forwards;z-index:25}
@keyframes spark{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(.6) translateY(-30px);opacity:0}}
/* road */
.road-bg{background:#9ccc65}
.road{position:absolute;left:20%;right:20%;top:0;bottom:0;background-color:#6b6b6b;background-image:linear-gradient(90deg,#fff 0 4px,transparent 4px calc(100% - 4px),#fff calc(100% - 4px)),repeating-linear-gradient(180deg,#f7d64a 0 34px,transparent 34px 68px);background-size:100% 100%,6px 100%;background-repeat:no-repeat,repeat-y;background-position:0 0,center 0}
.truck{position:absolute;width:18%;transition:left .15s;z-index:10}
.truck.hit{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.rock,.deco{position:absolute}
.roadmap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;font-size:12px;z-index:20}
.rm-bar{flex:1;height:10px;background:#e6decd;border-radius:6px;position:relative}
.rm-bar div{height:100%;background:var(--green);border-radius:6px;width:0}
.rm-bar i{position:absolute;top:-12px;font-style:normal;font-size:20px;transform:translateX(-50%) scaleX(-1);left:0}
.arrive{position:absolute;left:50%;top:-40%;width:70%;transform:translateX(-50%);transition:top 1.4s cubic-bezier(.2,.8,.3,1);z-index:5}
/* factory */
.fac-bg{background:linear-gradient(#eef2ec 0 72%,#cdd5ca 72%)}
.sign{position:absolute;left:50%;transform:translateX(-50%);top:108px;background:var(--deep);color:#fff;padding:5px 14px;border-radius:10px;font-size:14px;white-space:nowrap;z-index:5}
.progwrap{position:absolute;left:16px;right:16px;top:144px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:5}
.pbar{flex:1;height:14px;border-radius:8px;background:#dfe5dc;overflow:hidden;border:2px solid #fff}
.pbar div{height:100%;width:0;background:linear-gradient(90deg,#9ccc65,#4f9a3a)}
.tankbox{position:absolute;left:0;right:0;top:174px;bottom:30px;display:flex;justify-content:center;align-items:center;gap:14px}
.tankbox svg{height:100%;max-width:62%}
.thermo{position:relative;width:30px;height:70%;background:#fff;border-radius:16px;border:3px solid #c9d1c5;overflow:hidden}
.thermo .zone{position:absolute;left:0;right:0;bottom:66.7%;height:16.6%;background:rgba(124,179,66,.35);border-top:2px dashed var(--green);border-bottom:2px dashed var(--green)}
.thermo #tfill{position:absolute;left:6px;right:6px;bottom:4px;border-radius:10px;background:linear-gradient(#ff6b4a,#ffb347);height:5%}
.thermo.hot{border-color:#ff6b4a;animation:shake .3s infinite}
.tval{position:absolute;right:8px;bottom:36px;font-size:16px;background:#fff;border-radius:10px;padding:3px 8px}
.flyleaf{position:absolute;width:34px;height:34px;z-index:35;transition:left .55s ease-in,top .55s cubic-bezier(.3,-.6,.7,1),transform .55s;pointer-events:none}
/* line */
.belt{position:absolute;left:0;right:0;height:22px;background:repeating-linear-gradient(90deg,#4b4f4a 0 18px,#5d625b 18px 36px);border-top:4px solid #8a9086;border-bottom:6px solid #3a3d39}
.bottle{position:absolute;width:50px;z-index:6}
.bottle svg{width:100%;display:block;overflow:visible}
.bottle .liq{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .45s}
.bottle.filled .liq{transform:scaleY(1)}
.bottle .cap{transform:translateY(-60px);opacity:0;transition:.25s}
.bottle.capped .cap{transform:none;opacity:1}
.nozzle{position:absolute;width:44px;z-index:8}
.stream{position:absolute;width:6px;background:#a9cf8a;border-radius:3px;opacity:0;z-index:7;transition:opacity .1s}
.zoneMark{position:absolute;height:6px;background:rgba(124,179,66,.8);border-radius:3px;z-index:7}
.capper{position:absolute;width:64px;z-index:8}
/* overlay */
.overlay{position:absolute;inset:0;background:rgba(246,239,226,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:50}
.overlay h1{font-size:26px;color:var(--deep);margin:8px 0 4px;line-height:1.2}
.overlay p{margin:4px 0;font-size:16px;color:#5f6b56;line-height:1.5}
.flow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0}
.flow span{background:#fff;border-radius:12px;padding:6px 10px;font-size:14px;box-shadow:0 3px 0 #e2d7c1}
.transit .tr{width:120px;animation:drive 2s linear forwards}
@keyframes drive{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.final img{max-height:30vh;max-width:60%;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(47,93,58,.25));animation:reveal 1s cubic-bezier(.2,.9,.3,1.3)}
@keyframes reveal{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.stats{background:#fff;border-radius:16px;padding:10px 16px;margin-top:10px;font-size:15px;text-align:left;line-height:1.7;min-width:240px}
.stars{font-size:36px;letter-spacing:4px;color:#f6b93b;margin-top:6px}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards;z-index:49}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* home */
.home-bg{background:#e6f1d8}
.home-sky{position:absolute;left:0;right:0;top:0;bottom:30%;background:url(assets/tiger-hero.jpg) center top/100% auto no-repeat;filter:blur(1.5px) saturate(1.05);opacity:.9}
.home-floor{position:absolute;left:-15%;right:-15%;bottom:-6%;height:46%;border-radius:50% 50% 0 0/26% 26% 0 0;background:radial-gradient(ellipse at 50% 25%,#c3e494,#8cc152 70%);box-shadow:0 -6px 0 rgba(255,255,255,.35)}
.gauges{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:6px;z-index:25}
.gauge{flex:1;background:rgba(255,255,255,.92);border-radius:12px;padding:5px 8px;font-size:12px;white-space:nowrap;overflow:hidden}
.gbar{height:8px;background:#e5e0d3;border-radius:5px;overflow:hidden;margin-top:3px}
.gbar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#9ccc65,#4f9a3a);transition:width .25s}
.g-water .gbar i{background:linear-gradient(90deg,#8fd0f2,#3b8fd0)}
.g-mood .gbar i{background:linear-gradient(90deg,#ffc0d0,#f06292)}
.pet{position:absolute;left:50%;bottom:44px;width:min(76%,330px);transform:translateX(-50%);z-index:10}
.pet img{width:100%;display:block;filter:drop-shadow(0 16px 10px rgba(40,70,30,.28));transform-origin:50% 92%;animation:breathe 2.6s ease-in-out infinite;pointer-events:none;-webkit-user-drag:none}
.pet img.swap{animation:swap .4s cubic-bezier(.3,1.4,.5,1),breathe 2.6s .4s ease-in-out infinite}
.pet[data-pose=relax] img{animation:swap .4s cubic-bezier(.3,1.4,.5,1),snooze 3.2s .4s ease-in-out infinite}
.pet.hop img{animation:hop .5s}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
@keyframes snooze{50%{transform:rotate(-2deg) scale(1.01)}}
@keyframes swap{from{opacity:.2;transform:scale(.9)}}
@keyframes hop{40%{transform:translateY(-26px) scale(.98,1.03)}}
.hand{position:absolute;font-size:58px;line-height:1;pointer-events:none;z-index:45;display:none;transform:translate(-50%,-55%) rotate(-12deg);transition:transform .12s;filter:drop-shadow(0 5px 5px rgba(0,0,0,.25))}
.hand.rub{transform:translate(-50%,-55%) rotate(14deg)}
.heart{position:absolute;pointer-events:none;font-size:22px;animation:floatUp 1.2s forwards;z-index:40}
.petmode{cursor:none;touch-action:none}
.ticon{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.ticon svg{width:38px;height:30px}
.ticon.emo{font-size:30px;line-height:1}
.btn.wide{flex-basis:100%}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><div class="logo">Giant BYoungPool Game</div><div class="langs" id="langs"></div></div>
    <div class="steprow"><div class="steps" id="steps"></div><div class="pill">★ <span id="score">0</span></div></div>
  </header>
  <div class="scene" id="scene"></div>
  <div class="controls" id="controls"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const scene=$('#scene'),controls=$('#controls');
let S,cleanup=[];
function resetState(){S={score:0,harvest:0,giants:0,hits:0,drums:0,bottles:0,misses:0,overflow:0};$('#score').textContent=0}

/* ---------- art ---------- */
// BYoungPool leaf: round, finely scalloped blade with a narrow slit to the centre and palmate veins
const LEAF=(()=>{const cy=-19,RX=24,RY=18,N=120,gap=.27;let d=`M0,${cy+1}`;for(let i=0;i<=N;i++){const a=Math.PI/2-gap-(2*Math.PI-2*gap)*i/N,k=1+.03*Math.sin(a*11)**2;d+=`L${(RX*k*Math.cos(a)).toFixed(2)},${(cy+RY*k*Math.sin(a)).toFixed(2)}`}return d+'Z'})();
const VEIN=(()=>{const cy=-17,sx=1.2,sy=.9;let d='';[-90,-52,-128,-15,-165,22,158].forEach(g=>{const a=g*Math.PI/180,c=a+.12;d+=`M0,${cy}Q${(9*sx*Math.cos(c)).toFixed(1)},${(cy+9*sy*Math.sin(c)).toFixed(1)} ${(17*sx*Math.cos(a)).toFixed(1)},${(cy+17*sy*Math.sin(a)).toFixed(1)}`;[.5,-.5].forEach(o=>{const x=10*sx*Math.cos(a),y=cy+10*sy*Math.sin(a),b=a+o;d+=`M${x.toFixed(1)},${y.toFixed(1)}l${(5*Math.cos(b)).toFixed(1)},${(5*Math.sin(b)).toFixed(1)}`})});return d})();
const leafG=(fill='#8ccc4a')=>`<path d="${LEAF}" fill="${fill}" stroke="#5a9a2e" stroke-width="1.4" stroke-linejoin="round"/><path d="M0,-17 L-17,-29 A24,18 0 0 1 17,-29Z" fill="#fff" opacity=".07"/><path d="${VEIN}" stroke="#b3e07e" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".55"/>`;
const LEAF_SVG=`<svg viewBox="-27 -40 54 42">${leafG()}</svg>`;
function plantSVG(g,giant){
  const n=Math.min(7,1+Math.floor(g/16));
  const s=giant?1.22:(0.32+0.6*g/100);
  const ang=[0,-40,40,-72,72,-18,18],len=[44,38,38,30,30,48,48];
  let stems='',leaves='';
  for(let i=0;i<n;i++){
    const a=ang[i],r=a*Math.PI/180,x=Math.sin(r)*len[i]*.95,y=-Math.cos(r)*len[i];
    stems+=`<path d="M0,0 Q${x*.25},${y*.6} ${x},${y}" stroke="#6faa3c" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    leaves+=`<g transform="translate(${x},${y}) rotate(${a*.6}) scale(.95)">${leafG(['#8ccc4a','#7fc040','#97d65a'][i%3])}</g>`;
  }
  return `<svg class="plant${giant?' giant':''}" viewBox="-72 -100 144 108" preserveAspectRatio="xMidYMax meet"><ellipse cx="0" cy="2" rx="24" ry="5" fill="rgba(0,0,0,.18)"/><g transform="scale(${s})">${stems}${leaves}</g></svg>`;
}
const TIGER=`<img class="tigerimg" src="assets/tiger.jpg" alt="BYoungPool 호랑이">`;
const ICON={
 water:`<svg viewBox="0 0 48 48"><path d="M10 18h22v20a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3z" fill="#5fa8d3"/><path d="M31 23l10-9 3 3-11 10z" fill="#5fa8d3"/><path d="M14 18c0-8 14-8 14 0" stroke="#3b7fa8" stroke-width="3" fill="none"/><circle cx="45" cy="11" r="2" fill="#9fd3f0"/><circle cx="41" cy="8" r="1.6" fill="#9fd3f0"/></svg>`,
 capsule:`<svg viewBox="0 0 48 48"><g transform="rotate(-35 24 24)"><rect x="7" y="16" width="34" height="16" rx="8" fill="#f6c94c"/><path d="M24 16h9a8 8 0 0 1 0 16h-9z" fill="#5f9e3a"/><rect x="11" y="19" width="9" height="3" rx="1.5" fill="#fff" opacity=".7"/></g><text x="24" y="46" font-size="8" text-anchor="middle" fill="#5f9e3a" font-family="Jua">GIANT</text></svg>`,
 basket:`<svg viewBox="0 0 48 48"><g transform="translate(17 23) rotate(-25) scale(.36)">${leafG()}</g><g transform="translate(31 23) rotate(25) scale(.36)">${leafG('#7fc040')}</g><g transform="translate(24 21) scale(.4)">${leafG('#97d65a')}</g><path d="M8 22h32l-4 18H12z" fill="#c48a4a"/><path d="M10 27h28M11 32h26M12 37h24" stroke="#9a6533" stroke-width="2"/></svg>`
};
const TRUCK=`<svg viewBox="0 0 60 112"><rect x="1" y="12" width="7" height="16" rx="3" fill="#333"/><rect x="52" y="12" width="7" height="16" rx="3" fill="#333"/><rect x="1" y="80" width="7" height="18" rx="3" fill="#333"/><rect x="52" y="80" width="7" height="18" rx="3" fill="#333"/><rect x="6" y="2" width="48" height="30" rx="10" fill="#7cb342" stroke="#4f7f25" stroke-width="2"/><rect x="12" y="7" width="36" height="10" rx="4" fill="#d6eef7"/><rect x="4" y="34" width="52" height="74" rx="5" fill="#f4f1e8" stroke="#b9b19e" stroke-width="2"/>${[[16,52,20],[36,50,-30],[46,64,60],[22,72,-80],[40,82,130],[16,94,40],[34,104,-150],[48,100,200]].map(([x,y,r],i)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(.55) translate(0 22)">${leafG(['#8ccc4a','#7fc040','#97d65a'][i%3])}</g>`).join('')}</svg>`;

let lang='ko',lastSay=null,curStep=-1;
try{const v=localStorage.getItem('bp-lang');if(LANGS.some(l=>l[0]===v))lang=v}catch(_){}
function t(k,...a){const r=STR[k];if(!r)return k;const i=LANGS.findIndex(l=>l[0]===lang);return (r[i]??r[0]).replace(/\{(\d)\}/g,(_,n)=>a[n])}
// translatable span: re-rendered in place when the language changes
const L=(k,...a)=>`<span data-k="${k}" data-a='${JSON.stringify(a)}'>${t(k,...a)}</span>`;
function setLang(l){lang=l;try{localStorage.setItem('bp-lang',l)}catch(_){}document.documentElement.lang=HTML_LANG[l];
  document.querySelectorAll('[data-k]').forEach(e=>e.innerHTML=t(e.dataset.k,...JSON.parse(e.dataset.a||'[]')));
  if(lastSay)say(...lastSay);setStep(curStep);renderLangs()}
function renderLangs(){$('#langs').innerHTML=LANGS.map(([c,s,n])=>`<button class="${c===lang?'on':''}" title="${n}" aria-label="${n}" onclick="setLang('${c}')">${s}</button>`).join('')}

/* ---------- helpers ---------- */
let AC;function beep(f=600,d=.09,type='sine',v=.05){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ding=()=>{beep(880,.1);setTimeout(()=>beep(1320,.15),90)};
const buzz=()=>beep(160,.2,'square',.04);
function clearStage(){cleanup.forEach(f=>f());cleanup=[];scene.innerHTML='';controls.innerHTML='';scene.className='scene';scene.onpointermove=scene.onpointerleave=scene.onpointerdown=null;lastSay=null}
function loop(fn){let alive=true,last=performance.now();function t(now){if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;fn(dt);requestAnimationFrame(t)}requestAnimationFrame(t);const stop=()=>alive=false;cleanup.push(stop);return stop}
function later(fn,ms){const id=setTimeout(fn,ms);cleanup.push(()=>clearTimeout(id));return id}
function addScore(n,x,y){S.score=Math.max(0,S.score+n);$('#score').textContent=S.score;if(x!=null)floatText(x,y,(n>0?'+':'')+n)}
function floatText(x,y,t){const e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';scene.appendChild(e);setTimeout(()=>e.remove(),1000)}
function rel(el){const a=el.getBoundingClientRect(),b=scene.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}}
const TALK=`<div class="talk"><div class="tg">${TIGER}</div><div class="bubble" id="bubble"></div></div>`;
function say(k,...a){lastSay=[k,...a];const b=$('#bubble');if(!b)return;b.innerHTML=t(k,...a);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function setStep(n){curStep=n;$('#steps').innerHTML=['s1','s2','s3','s4','s5'].map((k,i)=>`<div class="${i<n?'done':i===n?'on':''}">${t(k)}</div>`).join('')}
function btn(html,cls='',onClick){const b=document.createElement('button');b.className='btn '+cls;b.innerHTML=html;if(onClick)b.onclick=onClick;controls.appendChild(b);return b}
function hold(b,cb){const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('held');cb(true)},off=()=>{b.classList.remove('held');cb(false)};b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(v=>b.addEventListener(v,off))}
function keys(map){const h=e=>{if(map[e.code]){e.preventDefault();map[e.code](e.type==='keydown',e)}};addEventListener('keydown',h);addEventListener('keyup',h);cleanup.push(()=>{removeEventListener('keydown',h);removeEventListener('keyup',h)})}
function transit(html,cb){const o=document.createElement('div');o.className='overlay transit';o.innerHTML=`<div class="tr">${SIDE_TRUCK}</div><p style="font-size:20px;color:#2f5d3a">${html}</p>`;scene.appendChild(o);beep(300,.3,'triangle');later(cb,2100)}
function fx(cls,txt,x,y,ms=1200){const e=document.createElement('div');e.className=cls;e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';scene.appendChild(e);setTimeout(()=>e.remove(),ms);return e}

/* ---------- 0. home: mini tiger care ---------- */
const POSES={sit:'assets/tiger-sit.png',eat:'assets/tiger-eat.png',drink:'assets/tiger-drink.png',relax:'assets/tiger-relax.png'};
Object.values(POSES).forEach(src=>{new Image().src=src});
const PET={full:55,water:55,mood:45};
function home(){
  clearStage();resetState();setStep(-1);scene.className='scene home-bg';
  scene.innerHTML=`<div class="home-sky"></div><div class="home-floor"></div>
  <div class="gauges">${[['full','🌿','gFull'],['water','💧','gWater'],['mood','💗','gMood']].map(([k,ic,lk])=>`<div class="gauge g-${k}"><span>${ic} ${L(lk)}</span><div class="gbar"><i id="g-${k}"></i></div></div>`).join('')}</div>
  <div class="pet" id="pet"><img id="timg" src="${POSES.sit}" alt="" draggable="false"></div>
  <div class="hand" id="hand">🖐️</div>`+TALK;
  const pet=$('#pet'),img=$('#timg'),hand=$('#hand');
  let pose='sit',poseTimer=null,petMode=false,rub=0,lastPt=null,heartAcc=0,rubTimer=null,saidPet=false;
  function setPose(p,ms){
    if(poseTimer){clearTimeout(poseTimer);poseTimer=null}
    if(pose!==p){pose=p;img.src=POSES[p];img.classList.remove('swap');void img.offsetWidth;img.classList.add('swap');pet.dataset.pose=p}
    if(ms)poseTimer=later(()=>{poseTimer=null;setPose('sit')},ms);
  }
  const center=()=>{const r=rel(pet);return{x:r.x+r.w/2,y:r.y+r.h*.45,r}};
  function hearts(n,x,y){for(let i=0;i<n;i++)setTimeout(()=>fx('heart',['💗','💚','✨'][i%3],x-20+Math.random()*40,y-10+Math.random()*20),i*90)}
  function flyTo(txt,from,cb){const c=center(),f=rel(from),e=fx('flyleaf',txt,f.x+f.w/2-17,f.y-30,900);e.style.fontSize='30px';requestAnimationFrame(()=>{e.style.left=(c.x-17)+'px';e.style.top=(c.y-10)+'px';e.style.transform='scale(1.3)'});later(cb,560)}
  function stopPet(){if(!petMode)return;petMode=false;scene.classList.remove('petmode');hand.style.display='none';petBtn.classList.remove('sel')}
  function feed(e){stopPet();if(PET.full>=95){say('tooFull');buzz();return}const b=e.currentTarget;beep(520,.06);
    flyTo('🌿',b,()=>{setPose('eat',2400);say('eat');PET.full=Math.min(100,PET.full+25);PET.mood=Math.min(100,PET.mood+6);const c=center();hearts(3,c.x,c.y-40);ding()})}
  function water(e){stopPet();if(PET.water>=95){say('tooWet');buzz();return}const b=e.currentTarget;beep(420,.06);
    flyTo('💧',b,()=>{setPose('drink',2400);say('drink');PET.water=Math.min(100,PET.water+25);PET.mood=Math.min(100,PET.mood+6);const c=center();hearts(3,c.x,c.y-40);beep(700,.12,'triangle')})}
  function togglePet(){if(petMode){stopPet();say('petOff');if(pose==='relax')setPose('sit');return}
    petMode=true;saidPet=false;rub=0;scene.classList.add('petmode');petBtn.classList.add('sel');say('petOn');beep(660,.05)}
  scene.onpointermove=e=>{
    if(!petMode)return;const s=scene.getBoundingClientRect(),x=e.clientX-s.left,y=e.clientY-s.top;
    hand.style.display='block';hand.style.left=x+'px';hand.style.top=y+'px';
    const r=rel(pet),inside=x>r.x+r.w*.12&&x<r.x+r.w*.88&&y>r.y+r.h*.12&&y<r.y+r.h*.95;
    if(lastPt&&inside){const d=Math.hypot(x-lastPt.x,y-lastPt.y);rub+=d;heartAcc+=d;hand.classList.toggle('rub',Math.floor(rub/40)%2===0);
      PET.mood=Math.min(100,PET.mood+d*.02);
      if(heartAcc>90){heartAcc=0;hearts(1,x,y-30);beep(900+Math.random()*200,.05,'sine',.025)}
      if(!saidPet&&pose==='sit'){saidPet=true;say('petting')}
      if(rub>420&&pose!=='relax'){setPose('relax');say('relax');ding()}
      if(rubTimer)clearTimeout(rubTimer);
      rubTimer=later(()=>{rub=0;saidPet=false;if(petMode&&pose==='relax'){setPose('sit');say('petOn')}},2600)}
    lastPt={x,y}};
  scene.onpointerleave=()=>{hand.style.display='none';lastPt=null};
  scene.onpointerdown=e=>{if(petMode){scene.onpointermove(e);return}
    const r=rel(pet),s=scene.getBoundingClientRect(),x=e.clientX-s.left,y=e.clientY-s.top;
    if(pose==='sit'&&x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h){pet.classList.remove('hop');void pet.offsetWidth;pet.classList.add('hop');say('roar');beep(240,.15,'sawtooth',.03)}};
  const mk=(icon,k,fn)=>{const b=document.createElement('button');b.className='tool';b.innerHTML=icon+L(k);b.onclick=fn;controls.appendChild(b);return b};
  mk(`<span class="ticon">${LEAF_SVG}</span>`,'feed',feed);
  mk(ICON.water,'water',water);
  const petBtn=mk('<span class="ticon emo">🖐️</span>','pet',togglePet);
  btn(L('start'),'big wide',()=>{beep(660);stageFarm()});
  say('hello');
  loop(dt=>{
    PET.full=Math.max(0,PET.full-dt*.5);PET.water=Math.max(0,PET.water-dt*.6);PET.mood=Math.max(0,PET.mood-dt*.35);
    ['full','water','mood'].forEach(k=>$('#g-'+k).style.width=PET[k]+'%');
  });
}

/* ---------- 1. farm ---------- */
function stageFarm(){
  clearStage();setStep(0);scene.className='scene farm-bg';
  const GOAL=12;let tool='water',finished=false;
  const plots=Array.from({length:6},()=>({g:0,giant:false}));
  scene.innerHTML=`<div class="gh" id="gh"></div><div class="goal">${ICON.basket}<span>${L('tHarv')} <b id="hv">0</b> / ${GOAL}</span></div>`+TALK;
  const gh=$('#gh');
  plots.forEach((p,i)=>{const d=document.createElement('div');d.className='plot';d.onclick=()=>act(i,d);gh.appendChild(d);p.el=d;draw(p)});
  function draw(p){p.el.innerHTML=plantSVG(p.g,p.giant)+`<div class="bar"><i style="width:${p.g}%;${p.giant?'background:#ffd84d':''}"></i></div>`+(p.giant?`<span class="tag g">${L('tagGiant')}</span>`:p.g>=100?`<span class="tag">${L('tagReady')}</span>`:'')}
  function act(i,el){
    if(finished)return;const p=plots[i],r=rel(el),cx=r.x+r.w/2,cy=r.y+r.h*.4;
    if(tool==='water'){
      if(p.g>=100){say(p.giant?'fullGiant':'fullGrown');return}
      p.g=Math.min(100,p.g+25);beep(500+p.g*4,.08);
      for(let k=0;k<5;k++){const d=document.createElement('div');d.className='drop';d.style.left=(cx-20+k*10)+'px';d.style.top=(cy-10+(k%2)*8)+'px';d.style.animationDelay=k*60+'ms';scene.appendChild(d);setTimeout(()=>d.remove(),800)}
      if(p.g>=100)say('grown');
    }else if(tool==='capsule'){
      if(p.g<100){say('capNeed');buzz();return}
      if(p.giant){say('capAlready');return}
      p.giant=true;ding();S.giants++;
      for(let k=0;k<6;k++){const s=document.createElement('div');s.className='spark';s.textContent=k%2?'✨':'⭐';s.style.left=(cx-30+Math.random()*60)+'px';s.style.top=(cy-30+Math.random()*50)+'px';s.style.animationDelay=k*70+'ms';scene.appendChild(s);setTimeout(()=>s.remove(),1200)}
      say('capOk');
    }else{
      if(p.g<100){say('harvNeed');buzz();return}
      const y=p.giant?3:1;S.harvest+=y;addScore(p.giant?40:10,cx-14,cy);ding();
      p.g=0;p.giant=false;$('#hv').textContent=Math.min(S.harvest,GOAL);
      if(S.harvest>=GOAL){finished=true;say('harvDone',S.harvest);controls.innerHTML='';btn(L('goShip'),'big',()=>stageTruck())}
      else say(y>1?'harvGiant':'harvOne');
    }
    draw(p);
  }
  const tools=[['water','tWater'],['capsule','tCap'],['basket','tHarv']];
  tools.forEach(([k,label])=>{const b=document.createElement('button');b.className='tool'+(k==='water'?' sel':'');b.innerHTML=ICON[k]+L(label);b.onclick=()=>{tool=k;[...controls.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel');beep(700,.05)};controls.appendChild(b)});
  say('farmHello');
}

  const W=scene.clientWidth,H=scene.clientHeight,road=$('#road'),truck=$('#truck'),layer=$('#layer');
  const laneX=l=>W*(l?.65:.35),tw=W*.18,th=tw*112/60,tTop=H-th-64;
  let lane=0,prog=0,off=0,spawn=1,done=false;const speed=H*.55,items=[];
  truck.style.top=tTop+'px';const place=()=>truck.style.left=(laneX(lane)-tw/2)+'px';place();
  const setLane=l=>{if(done)return;lane=l;place();beep(420,.04)};
  for(let i=0;i<8;i++){const e=document.createElement('div');e.className='deco';const left=i%2===0;e.innerHTML=[PALM,ORANGE,HARUBANG,PALM][i%4];const w=i%4===1?W*.07:W*.12;e.style.width=w+'px';e.style.left=(left?W*.03:W*.85)+'px';layer.appendChild(e);items.push({el:e,y:i*H/8,deco:true})}
  scene.onpointerdown=e=>{const r=scene.getBoundingClientRect();setLane(e.clientX-r.left>W/2?1:0)};
  btn(L('left'),'',()=>setLane(0));btn(L('right'),'',()=>setLane(1));
  keys({ArrowLeft:d=>d&&setLane(0),ArrowRight:d=>d&&setLane(1)});
  say('truckHello');
  loop(dt=>{
    if(done)return;
    prog=Math.min(100,prog+dt*7.5);off=(off+speed*dt)%68;road.style.backgroundPosition=`0 0,center ${off}px`;
    $('#rmf').style.width=prog+'%';$('#rmt').style.left=prog+'%';
    spawn-=dt;if(spawn<=0&&prog<90){spawn=.75+Math.random()*.6;const l=Math.random()<.5?0:1,e=document.createElement('div');e.className='rock';const s=W*.13;e.style.width=s+'px';e.style.left=(laneX(l)-s/2)+'px';e.innerHTML=ROCK;layer.appendChild(e);items.push({el:e,y:-s,lane:l,s})}
    for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=speed*dt;
      if(it.deco){if(it.y>H)it.y-=H+60;it.el.style.top=it.y+'px';continue}
      it.el.style.top=it.y+'px';
      if(!it.hit&&it.lane===lane&&it.y+it.s*.8>tTop+8&&it.y<tTop+th-10){it.hit=true;S.hits++;prog=Math.max(0,prog-6);truck.classList.remove('hit');void truck.offsetWidth;truck.classList.add('hit');buzz();say('hit');it.el.style.opacity=.4}
      if(it.y>H){it.el.remove();items.splice(i,1)}
    }
    if(prog>=100){done=true;items.filter(i=>!i.deco).forEach(i=>i.el.remove());
      const a=document.createElement('div');a.className='arrive';a.innerHTML=ASKBASE;scene.appendChild(a);requestAnimationFrame(()=>a.style.top='12%');
      const bonus=Math.max(10,60-S.hits*10);addScore(bonus,W/2,H*.5);ding();
      say('arrive',S.hits);controls.innerHTML='';btn(L('toTank'),'big',()=>stageTank())}
  });
}

/* ---------- 3. tank ---------- */
function stageTank(){
  clearStage();setStep(2);scene.className='scene fac-bg';
  scene.innerHTML=`<div class="sign">${L('tankSign')}</div><div class="progwrap">${L('extract')}<div class="pbar"><div id="pf"></div></div><b id="pt">0%</b></div>
  <div class="tankbox"><svg id="tank" viewBox="0 0 200 270"><defs><linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#b9c0bb"/><stop offset=".35" stop-color="#f4f6f4"/><stop offset=".7" stop-color="#cfd5d0"/><stop offset="1" stop-color="#9ea69f"/></linearGradient><clipPath id="win"><rect x="60" y="95" width="80" height="112" rx="12"/></clipPath></defs>
  <rect x="45" y="225" width="12" height="40" fill="#8b928c"/><rect x="143" y="225" width="12" height="40" fill="#8b928c"/>
  <rect x="30" y="40" width="140" height="195" rx="34" fill="url(#steel)" stroke="#8b928c" stroke-width="3"/>
  <rect x="84" y="20" width="32" height="24" rx="5" fill="#aeb5af" stroke="#8b928c" stroke-width="3"/>
  <rect id="heater" x="40" y="214" width="120" height="10" rx="5" fill="#9aa19b"/>
  <rect x="60" y="95" width="80" height="112" rx="12" fill="#eaf4f6" stroke="#8b928c" stroke-width="3"/>
  <g clip-path="url(#win)"><rect id="liq" x="60" y="207" width="80" height="0" fill="#d6ecf0"/><g id="lv"></g><g id="bub"></g></g>
  <text x="100" y="78" font-size="13" text-anchor="middle" fill="#2f5d3a" font-family="Jua">BYoungPool</text>
  <g id="flame" opacity="0"><path d="M70 262 q6-16 12 0z M95 262 q6-20 12 0z M120 262 q6-16 12 0z" fill="#ff8a3d"/></g></svg>
  <div class="thermo" id="thermo"><div class="zone"></div><div id="tfill"></div></div></div><div class="tval" id="tv">25°C</div>`+TALK;
  let phase='load',left=S.harvest,water=0,temp=25,prog=0,heating=false,warnT=0;
  const liq=$('#liq'),lv=$('#lv'),bub=$('#bub'),bubbles=[];
  for(let i=0;i<9;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',2+Math.random()*2.5);c.setAttribute('fill','rgba(255,255,255,.75)');bub.appendChild(c);bubbles.push({c,x:66+Math.random()*68,y:210+Math.random()*80,v:30+Math.random()*40})}
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  function render(){
    const lvl=water*.82,top=207-112*lvl;liq.setAttribute('y',top);liq.setAttribute('height',112*lvl);
    const t=prog/100;liq.setAttribute('fill',`rgb(${lerp(214,150,t)},${lerp(236,196,t)},${lerp(240,104,t)})`);
    lv.style.opacity=1-t*.85;
    $('#pf').style.width=prog+'%';$('#pt').textContent=Math.floor(prog)+'%';
    $('#tfill').style.height=Math.max(5,(temp-20)/90*100)+'%';$('#tv').textContent=Math.round(temp)+'°C';
    $('#heater').setAttribute('fill',heating?'#ff7a3d':temp>60?'#e2a77f':'#9aa19b');$('#flame').setAttribute('opacity',heating?1:0);
    $('#thermo').classList.toggle('hot',temp>100);
  }
  function addLeafInTank(){const g=document.createElementNS('http://www.w3.org/2000/svg','g');const x=68+Math.random()*64,y=170+Math.random()*32;g.setAttribute('transform',`translate(${x} ${y}) rotate(${Math.random()*360}) scale(.46)`);g.innerHTML=leafG(Math.random()<.5?'#6aae3f':'#7fbf4d');lv.appendChild(g)}
  function fly(){const tk=rel($('#tank')),b=document.createElement('div');b.className='flyleaf';b.innerHTML=LEAF_SVG;b.style.left=(scene.clientWidth/2-17)+'px';b.style.top=(scene.clientHeight-30)+'px';scene.appendChild(b);requestAnimationFrame(()=>{b.style.left=(tk.x+tk.w/2-17)+'px';b.style.top=(tk.y+tk.h*.08)+'px';b.style.transform='rotate(200deg) scale(.6)'});setTimeout(()=>{b.remove();addLeafInTank()},560)}
  const per=Math.max(1,Math.ceil(S.harvest/6));
  const loadBtn=btn(L('load',left),'',()=>{if(phase!=='load')return;const n=Math.min(per,left);left-=n;fly();beep(520,.06);loadBtn.innerHTML=L('load',left);
    if(left<=0){phase='water';later(()=>{controls.innerHTML='';say('loadDone');btn(L('lavaBtn'),'blue',e=>{e.currentTarget.disabled=true;phase='filling';beep(400,.4,'triangle')})},600)}});
  say('loadHello',S.harvest);
  loop(dt=>{
    if(phase==='filling'){water=Math.min(1,water+dt*.9);if(water>=1){phase='heat';controls.innerHTML='';
      say('heatHello');
      const h=btn(L('heatBtn'),'orange big');hold(h,v=>heating=v);keys({Space:d=>heating=d})}}
    if(phase==='heat'){
      temp+=heating?28*dt:-13*dt;temp=Math.max(25,Math.min(112,temp));warnT-=dt;
      if(temp>=80&&temp<=95)prog+=9.5*dt;
      else if(temp>100){prog=Math.max(0,prog-6*dt);if(warnT<=0){say('tooHot');buzz();warnT=1.5}}
      if(temp>60)bubbles.forEach(b=>{b.y-=b.v*dt*(temp/80);if(b.y<100){b.y=208;b.x=66+Math.random()*68}b.c.setAttribute('cx',b.x);b.c.setAttribute('cy',b.y)});
      if(prog>=100){prog=100;phase='done';heating=false;controls.innerHTML='';addScore(60,scene.clientWidth/2,200);ding();
        say('tankDone');btn(L('toBulk'),'big',()=>stageBulk())}
    }
    render();
  });
}

/* ---------- 4. bulk ---------- */
function stageBulk(){
  clearStage();setStep(3);scene.className='scene fac-bg';
  const NEED=2;let lvl=0,open=false,locked=false;
  scene.innerHTML=`<div class="sign">${L('bulkSign')}</div><div class="progwrap">${L('drum')}<div class="pbar"><div id="pf"></div></div><b id="pt">0 / ${NEED}</b></div>
  <div class="tankbox"><svg viewBox="0 0 240 330" style="max-width:90%"><defs><linearGradient id="steel2" x1="0" x2="1"><stop offset="0" stop-color="#b9c0bb"/><stop offset=".4" stop-color="#f4f6f4"/><stop offset="1" stop-color="#9ea69f"/></linearGradient></defs>
  <rect x="70" y="6" width="100" height="70" rx="18" fill="url(#steel2)" stroke="#8b928c" stroke-width="3"/><text x="120" y="46" font-size="13" text-anchor="middle" fill="#2f5d3a" font-family="Jua" data-k="leafWater">${t('leafWater')}</text>
  <rect x="114" y="76" width="12" height="52" fill="#a7aea8"/><g id="valve" transform="translate(120 104)"><circle r="14" fill="none" stroke="#e0473a" stroke-width="5"/><path d="M-14 0H14M0-14V14" stroke="#e0473a" stroke-width="4"/></g>
  <rect x="110" y="126" width="20" height="10" rx="3" fill="#8b928c"/>
  <rect id="stream" x="116" y="136" width="8" height="0" fill="#9cc77a" opacity="0"/>
  <g id="drum"><rect id="lid" x="56" y="120" width="128" height="14" rx="6" fill="#255b92" opacity="0"/>
  <rect x="56" y="164" width="128" height="12" rx="6" fill="#255b92"/><rect x="60" y="170" width="120" height="152" rx="12" fill="#2e73b8"/>
  <rect x="78" y="184" width="84" height="124" rx="8" fill="#dbe7f1"/><rect id="dl" x="78" y="308" width="84" height="0" fill="#9cc77a"/>
  <rect x="74" y="184" width="92" height="15" fill="rgba(255,216,77,.25)" stroke="#f2b705" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M60 214H78M162 214H180M60 282H78M162 282H180" stroke="#255b92" stroke-width="4"/>
  <g id="label" opacity="0"><rect x="80" y="220" width="80" height="46" rx="6" fill="#fff" stroke="#2f5d3a" stroke-width="2"/><text x="120" y="238" font-size="10" text-anchor="middle" fill="#2f5d3a" font-family="Jua">BYoungPool</text><text x="120" y="252" font-size="10" text-anchor="middle" fill="#2f5d3a" font-family="Jua">LEAF WATER</text><text x="120" y="262" font-size="7" text-anchor="middle" fill="#7a8a70" font-family="Jua">ASK BASE</text></g>
  <text id="pct" x="120" y="300" font-size="12" text-anchor="middle" fill="#2f5d3a" font-family="Jua">0%</text></g></svg></div>`+TALK;
  const dl=$('#dl'),st=$('#stream'),drum=$('#drum');let rot=0;
  say('bulkHello');
  const vb=btn(L('valveBtn'),'blue big');
  hold(vb,v=>{if(locked)return;open=v;if(!v)check()});keys({Space:d=>{if(locked)return;open=d;if(!d)check()}});
  function check(){
    if(lvl<.05)return;
    if(lvl>=.88&&lvl<=1){locked=true;S.drums++;ding();addScore(30,scene.clientWidth/2,220);
      $('#lid').setAttribute('opacity',1);$('#lid').style.transition='transform .4s';requestAnimationFrame(()=>$('#lid').style.transform='translateY(44px)');$('#label').setAttribute('opacity',1);
      $('#pf').style.width=(S.drums/NEED*100)+'%';$('#pt').textContent=`${S.drums} / ${NEED}`;
      if(S.drums<NEED){say('perfect',S.drums);later(nextDrum,1300)}
      else{say('bulkDone');controls.innerHTML='';btn(L('shipBtn'),'big',()=>{controls.innerHTML='';transit(L('transit'),stageFactory)})}
    }else if(lvl<.88)say('notYet',Math.round(lvl*100));
  }
  function nextDrum(){drum.style.transition='transform .5s';drum.style.transform='translateX(260px)';later(()=>{drum.style.transition='none';drum.style.transform='translateX(-260px)';lvl=0;$('#lid').style.transform='';$('#lid').setAttribute('opacity',0);$('#label').setAttribute('opacity',0);requestAnimationFrame(()=>{drum.style.transition='transform .5s';drum.style.transform='';locked=false})},520)}
  loop(dt=>{
    if(open&&!locked){lvl+=dt*.3;rot+=dt*360;
      if(lvl>1.04){open=false;locked=true;S.overflow++;buzz();addScore(-10,scene.clientWidth/2,220);say('overflow');later(()=>{lvl=0;locked=false},900)}}
    $('#valve').setAttribute('transform',`translate(120 104) rotate(${rot})`);
    const top=308-124*Math.min(lvl,1);dl.setAttribute('y',top);dl.setAttribute('height',124*Math.min(lvl,1));
    st.setAttribute('opacity',open&&!locked?1:0);st.setAttribute('height',Math.max(0,top-136));
    $('#pct').textContent=Math.round(lvl*100)+'%';
  });
}

/* ---------- 5. factory ---------- */
function stageFactory(){
  clearStage();setStep(4);scene.className='scene fac-bg';
  const NEED=6;let filled=0,spawn=.3,ending=false;const bottles=[];
  scene.innerHTML=`<div class="sign">${L('facSign')}</div><div class="belt" id="belt"></div>
  <svg class="nozzle" id="nz" viewBox="0 0 44 60"><rect x="0" y="0" width="44" height="34" rx="8" fill="#cfd5d0" stroke="#8b928c" stroke-width="3"/><text x="22" y="22" font-size="9" text-anchor="middle" fill="#2f5d3a" font-family="Jua">FILL</text><path d="M16 34h12l-3 22h-6z" fill="#8b928c"/></svg>
  <div class="stream" id="st"></div><div class="zoneMark" id="zm"></div>
  <svg class="capper" id="cp" viewBox="0 0 64 60"><rect x="4" y="0" width="56" height="34" rx="8" fill="#b9d3a2" stroke="#4d6b3f" stroke-width="3"/><text x="32" y="22" font-size="9" text-anchor="middle" fill="#2f5d3a" font-family="Jua">CAP</text><rect x="26" y="34" width="12" height="20" fill="#8b928c"/></svg>
  <div class="goal" style="bottom:12px"><span>🧴 ${L('made')} <b id="bc">0</b> / ${NEED}</span></div>`+TALK;
  const W=scene.clientWidth,H=scene.clientHeight,beltY=H*.66,bw=50,bh=bw*3.1,nzX=W*.42,capX=W*.74;
  $('#belt').style.top=beltY+'px';
  const nz=$('#nz');nz.style.left=(nzX-22)+'px';nz.style.top=(beltY-bh-62)+'px';
  const stE=$('#st');stE.style.left=(nzX-3)+'px';stE.style.top=(beltY-bh-6)+'px';stE.style.height=(bh*.85)+'px';
  const zm=$('#zm');zm.style.left=(nzX-26)+'px';zm.style.width='52px';zm.style.top=(beltY-4)+'px';
  const cp=$('#cp');cp.style.left=(capX-32)+'px';cp.style.top=(beltY-bh-58)+'px';
  let beltOff=0;
  function fill(){
    if(ending)return;
    const b=bottles.find(b=>!b.filled&&Math.abs(b.x-nzX)<26);
    if(!b){buzz();say('miss');S.misses++;return}
    b.filled=true;b.el.classList.add('filled');filled++;beep(700,.12,'triangle');addScore(15,nzX-10,beltY-bh-40);
    stE.style.opacity=1;setTimeout(()=>stE.style.opacity=0,350);$('#bc').textContent=filled;
    if(filled<NEED)say(['good1','good2','good3'][filled%3]);
  }
  btn(L('fillBtn'),'big',fill);
  scene.onpointerdown=e=>{if(!e.target.closest('.talk'))fill()};
  keys({Space:d=>d&&fill()});
  say('facHello');
  loop(dt=>{
    const sp=W*.17+filled*W*.012;beltOff=(beltOff+sp*dt)%36;$('#belt').style.backgroundPosition=beltOff+'px 0';
    spawn-=dt;if(spawn<=0&&!ending){spawn=Math.max(1.05,1.6-filled*.08);const e=document.createElement('div');e.className='bottle';e.innerHTML=BOTTLE;e.style.top=(beltY-bh)+'px';scene.appendChild(e);bottles.push({el:e,x:-30})}
    for(let i=bottles.length-1;i>=0;i--){const b=bottles[i];b.x+=sp*dt;b.el.style.left=(b.x-bw/2)+'px';
      if(b.filled&&!b.capped&&b.x>=capX){b.capped=true;b.el.classList.add('capped');S.bottles++;beep(990,.06)}
      if(b.x>W+40){if(!b.filled)S.misses++;b.el.remove();bottles.splice(i,1)}}
    if(filled>=NEED&&!ending&&bottles.filter(b=>b.filled).every(b=>b.capped)){ending=true;ding();say('facDone');later(stageEnd,1200)}
  });
}

/* ---------- end ---------- */
function stageEnd(){
  clearStage();setStep(5);scene.className='scene farm-bg';
  const stars=Math.max(1,3-(S.hits>2?1:0)-(S.misses+S.overflow>3?1:0));
  scene.innerHTML=`<div class="overlay final"><img src="assets/booster.webp" alt="ICD Dermatology Booster"><h1>${L('endTitle')}</h1><div class="stars">${'★'.repeat(stars)}<span style="color:#ddd2bd">${'★'.repeat(3-stars)}</span></div>
  <div class="stats">${L('stHarv',S.harvest,S.giants)}<br>${L('stHits',S.hits)}<br>${L('stDrums',S.drums,S.overflow)}<br>${L('stBottles',S.bottles,S.misses)}<br>${L('stScore',S.score)}</div></div>`;
  const cols=['#7cb342','#f39c32','#ffd84d','#5fb6e8','#b9d3a2'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=Math.random()*1.2+'s';scene.appendChild(c)}
  ding();later(()=>ding(),300);
  btn(L('again'),'big',home);
}
document.documentElement.lang=HTML_LANG[lang];renderLangs();home();
</script>
</body>
